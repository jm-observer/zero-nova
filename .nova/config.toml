# ── 供应商接入 ──────────────────────────────────────────────────
# 按实际环境替换以下占位符；密钥建议通过环境变量注入，避免明文提交
[providers.spark-12340]
# api_key = ""
base_url = "http://192.168.0.68:8085/v1"

[providers.spark-8000]
# api_key = "<CLOUD_PROVIDER_API_KEY>"
base_url = "http://192.168.0.68:8082/v1"

# ── 模型调用参数 ────────────────────────────────────────────────
[llms.gemma]
provider = "spark-12340"
#model = "Huihui-Qwen3.6-35B-A3B-Claude-4.6"
model = "gemma-4-26B-A4B-it"
max_tokens = 8192
temperature = 0.5

[llms."qwen3-6-4.6"]
provider = "spark-8000"
model = "Huihui-Qwen3.6-35B-A3B-Claude-4.6"
max_tokens = 8192
temperature = 0.5

[llms."qwen3-6-4.7"]
provider = "spark-8000"
model = "Huihui-Qwen3.6-35B-A3B-Claude-4.7"
max_tokens = 8192
temperature = 0.3

# ── 搜索 ───────────────────────────────────────────────────────
# Tavily 接入时替换占位符；如果当前不启用搜索，可先保留该值
[search]
backend = "tavily"
tavily_api_key = "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"

# ── 工具与能力 ──────────────────────────────────────────────────
[tool]
skills_dir = "skills"
prompts_dir = "prompts"
project_context_file = "PROJECT.md"
default_project_dir = ""
default_policy = "workflow"

[tool.bash]
shell = "powershell"
sandbox = false

# ── 网关 ───────────────────────────────────────────────────────
[gateway]
host = "127.0.0.1"
port = 18801
max_iterations = 80
tool_timeout_secs = 3600
subagent_timeout_secs = 300
max_tokens = 4096
skill_routing_enabled = true
skill_history_strategy = "global"
use_turn_context = true

[gateway.trimmer]
enabled = true
context_window = 128000
output_reserve = 8192
min_recent_messages = 10

[gateway.side_channel]
enabled = false
skill_reminder_interval = 5
inject_date = true

# ── Agent 注册 ──────────────────────────────────────────────────
[[gateway.agents]]
id = "nova"
display_name = "Nova"
description = "默认通用助手"
aliases = ["助手"]
provider = "spark-12340"
llm = "gemma"
prompt_file = "agent-nova.md"

[[gateway.agents]]
id = "developer"
display_name = "Developer"
description = "开发任务子代理"
aliases = ["开发", "coder"]
provider = "spark-8000"
llm = "qwen3-6-4.6"
prompt_file = "agent-developer.md"

# ── 桌面端远程连接 ──────────────────────────────────────────────
[remote]
enabled = true
host = "127.0.0.1"
port = 18801

# ── Sidecar 启动 ───────────────────────────────────────────────
[sidecar]
#mode = "auto"
mode = "manual"
name = "Built-in Gateway"
command = "nova_gateway_ws"
args = []
port_arg = "--port"
workspace_arg = "--workspace"
