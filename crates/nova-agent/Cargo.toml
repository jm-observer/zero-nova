[package]
name = "nova-agent"
version = "0.1.1"
edition = "2021"
description = "Core agent library for zero-nova"

[dependencies]
tokio-util = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true, optional = true }
log = { workspace = true }
custom-utils = { workspace = true }
reqwest = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
scraper = { workspace = true }
futures-util = { workspace = true }
uuid = { workspace = true }
toml = { workspace = true }
sysinfo = { workspace = true }
which = { workspace = true }
chrono = { workspace = true }
once_cell = { workspace = true }
regex = { workspace = true }
sqlx = { workspace = true }
nova-protocol = { workspace = true }
async-openai = { workspace = true }
tokio-stream = { workspace = true }
arc-swap = { workspace = true }
nova-agent-config = { workspace = true }

[features]
default = []
mcp-websocket = ["dep:tokio-tungstenite"]
# 启用工具子进程的 traceparent 透传：读宿主 scope 的 task-local，注入
# TRACEPARENT env 给 ExternalCommandTool 子进程。需配合 custom-utils 的
# `trace` feature（由本 feature 转开）。未启用时整段代码缺席、零开销。
trace-propagation = ["custom-utils/trace"]

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "macros"] }
wiremock = { workspace = true }
